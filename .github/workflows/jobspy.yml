name: Búsqueda JobSpy

# Plan de búsqueda del usuario (2026-10-27): Indeed Colombia, Google Jobs y LinkedIn (vista pública) 4 veces al día.
# El resultado se publica en la rama "datos" (jobspy.json) y Apps Script lo lee en sus búsquedas de las 7:00 y 12:30.
# Horas en UTC: 6:17, 11:47, 16:17 y 21:17 en Bogotá (GitHub puede retrasar los programados unos minutos).
on:
  schedule:
    - cron: "17 11 * * *"
    - cron: "47 16 * * *"
    - cron: "17 21 * * *"
    - cron: "17 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: jobspy
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "python-jobspy==1.4.1"
      - name: Traer lo acumulado
        run: |
          mkdir -p salida
          if git fetch --depth=1 origin datos; then git show FETCH_HEAD:jobspy.json > salida/jobspy.json || true; fi
      - run: python tools/jobspy_buscar.py salida/jobspy.json
      - name: Publicar en la rama datos
        working-directory: salida
        run: |
          git init -q
          git checkout -q -b datos
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobspy.json
          git commit -qm "JobSpy $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" datos
