name: Pipeline diario de vacantes UX/UI

on:
  schedule:
    # 13:00 UTC = 8:00 AM hora de Colombia (UTC-5)
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Modo de ejecución"
        type: choice
        default: normal
        options: [normal, test, dry-run]

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Ejecutar pipeline
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_FOLDER_ID }}
          GOOGLE_DOCS_MASTER_TEMPLATE_ID: ${{ secrets.GOOGLE_DOCS_MASTER_TEMPLATE_ID }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: |
          case "${{ inputs.mode || 'normal' }}" in
            test)    python scheduler/daily_job.py --test ;;
            dry-run) python scheduler/daily_job.py --test --dry-run ;;
            *)       python scheduler/daily_job.py ;;
          esac
